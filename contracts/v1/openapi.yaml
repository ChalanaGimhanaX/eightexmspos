openapi: 3.1.0
info:
  title: Enightx POS Cloud Sync & Management API
  version: 1.0.0
  description: Versioned API contract for device sync, health, and cloud aggregation.
paths:
  /health:
    get:
      summary: Health and readiness check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy and database is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 1.0.0
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/devices/enroll:
    post:
      summary: Enroll a new POS counter terminal
      operationId: enrollDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/device-enrollment.json'
      responses:
        '200':
          description: Device enrolled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_id:
                    type: string
                  device_generation:
                    type: integer
                  token:
                    type: string

  /api/v1/sync/push:
    post:
      summary: Push an authenticated batch of events from counter or relay
      operationId: pushSyncBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/sync-batch.json'
      responses:
        '200':
          description: Batch accepted and durably persisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: string
                  acknowledged_sequence:
                    type: integer
                  status:
                    type: string
                    example: acknowledged

  /api/v1/reports/sales/summary:
    get:
      summary: Retrieve aggregated sales and tender breakdown
      operationId: getSalesSummaryReport
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
            default: TENANT_LK_01
        - name: branch_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Sales summary report retrieved successfully

  /api/v1/reports/top-products:
    get:
      summary: Retrieve top-selling products by revenue
      operationId: getTopProductsReport
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
            default: TENANT_LK_01
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Top products retrieved successfully

  /api/v1/reports/dashboard:
    get:
      summary: Retrieve unified dashboard metrics for back-office portal
      operationId: getDashboardSummary
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
            default: TENANT_LK_01
      responses:
        '200':
          description: Dashboard metrics retrieved successfully

