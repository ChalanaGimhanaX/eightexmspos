openapi: 3.1.0
info:
  title: Enightx POS Cloud Sync & Management API
  version: 1.0.0
  description: Versioned API contract for device sync, health, and cloud aggregation.
paths:
  /health:
    get:
      summary: Health and readiness check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy and database is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 1.0.0
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/devices/enroll:
    post:
      summary: Enroll a new POS counter terminal
      operationId: enrollDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/device-enrollment.json'
      responses:
        '200':
          description: Device enrolled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_id:
                    type: string
                  device_generation:
                    type: integer
                  token:
                    type: string

  /api/v1/sync/push:
    post:
      summary: Push an authenticated batch of events from counter or relay
      operationId: pushSyncBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/sync-batch.json'
      responses:
        '200':
          description: Batch accepted and durably persisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: string
                  acknowledged_sequence:
                    type: integer
                  status:
                    type: string
                    example: acknowledged

  /api/v1/suppliers:
    post:
      summary: Register a new supplier
      operationId: createSupplier
      responses:
        '201':
          description: Supplier created
    get:
      summary: List suppliers with balance
      operationId: listSuppliers
      responses:
        '200':
          description: Supplier list

  /api/v1/suppliers/settlement:
    post:
      summary: Record payment to supplier
      operationId: recordSupplierSettlement
      responses:
        '201':
          description: Settlement recorded

  /api/v1/purchases/orders:
    post:
      summary: Create purchase order
      operationId: createPurchaseOrder
      responses:
        '201':
          description: Purchase order created
    get:
      summary: List purchase orders
      operationId: listPurchaseOrders
      responses:
        '200':
          description: Purchase order list

  /api/v1/purchases/grn:
    post:
      summary: Receive goods via GRN and update stock/cost basis
      operationId: createGRN
      responses:
        '201':
          description: GRN recorded and inventory updated
    get:
      summary: List Goods Received Notes
      operationId: listGRNs
      responses:
        '200':
          description: GRN list
