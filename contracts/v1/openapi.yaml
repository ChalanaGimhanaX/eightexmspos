openapi: 3.1.0
info:
  title: Enightx POS Cloud Sync & Management API
  version: 1.0.0
  description: Versioned API contract for device sync, health, and cloud aggregation.
paths:
  /health:
    get:
      summary: Health and readiness check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy and database is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 1.0.0
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/devices/enroll:
    post:
      summary: Enroll a new POS counter terminal
      operationId: enrollDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/device-enrollment.json'
      responses:
        '200':
          description: Device enrolled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_id:
                    type: string
                  device_generation:
                    type: integer
                  token:
                    type: string

  /api/v1/devices/heartbeat:
    post:
      summary: Send periodic heartbeat and telemetry from a counter terminal
      operationId: deviceHeartbeat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/device-heartbeat.json'
      responses:
        '200':
          description: Heartbeat recorded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  server_time_utc:
                    type: string
                    format: date-time
                  acknowledged_sequence:
                    type: integer
                  command:
                    type: string
                    nullable: true
        '401':
          description: Invalid device credentials or missing token


  /api/v1/sync/push:
    post:
      summary: Push an authenticated batch of events from counter or relay
      operationId: pushSyncBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/sync-batch.json'
      responses:
        '200':
          description: Batch accepted and durably persisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id:
                    type: string
                  acknowledged_sequence:
                    type: integer
                  status:
                    type: string
                    example: acknowledged

  /api/v1/shifts/close:
    post:
      summary: Ingest closed shift cash drawer audit data and calculate reconciliation variance
      operationId: closeShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/shift-close.json'
      responses:
        '200':
          description: Shift closed and reconciled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift_id:
                    type: string
                    format: uuid
                  expected_cash:
                    type: string
                  actual_counted_cash:
                    type: string
                  variance:
                    type: string
                  status:
                    type: string
                    example: closed
                  reconciled_at:
                    type: string
                    format: date-time

  /api/v1/shifts/{shift_id}:
    get:
      summary: Retrieve shift reconciliation details by shift ID
      operationId: getShiftDetails
      parameters:
        - name: shift_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Shift details retrieved successfully
        '404':
          description: Shift not found

  /api/v1/customers:
    post:
      summary: Register a new customer with credit terms
      operationId: createCustomer
      responses:
        '201':
          description: Customer created successfully
    get:
      summary: List customers and their credit balances
      operationId: listCustomers
      responses:
        '200':
          description: Customer list retrieved successfully

  /api/v1/customers/settlement:
    post:
      summary: Settle outstanding customer debt via counter or cloud
      operationId: settleCustomerDebt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/customer-settlement.json'
      responses:
        '200':
          description: Debt payment recorded and remaining balance calculated
        '400':
          description: Invalid settlement amount
        '404':
          description: Customer not found

  /api/v1/inventory/transfers/request:
    post:
      summary: Request an inter-branch stock transfer
      operationId: requestStockTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/stock-transfer.json'
      responses:
        '201':
          description: Transfer request created successfully
        '400':
          description: Invalid transfer request

  /api/v1/inventory/transfers/{transfer_id}/dispatch:
    post:
      summary: Dispatch items for an inter-branch transfer
      operationId: dispatchStockTransfer
      parameters:
        - name: transfer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transfer dispatched and source stock decremented
        '400':
          description: Insufficient stock or invalid status

  /api/v1/inventory/transfers/{transfer_id}/receive:
    post:
      summary: Receive items for an inter-branch transfer at destination branch
      operationId: receiveStockTransfer
      parameters:
        - name: transfer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transfer received and destination stock incremented
        '400':
          description: Invalid transfer status

  /api/v1/reports/sales/summary:
    get:
      summary: Retrieve aggregated sales and tender breakdown
      operationId: getSalesSummaryReport
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
            default: TENANT_LK_01
        - name: branch_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Sales summary report retrieved successfully

  /api/v1/reports/top-products:
    get:
      summary: Retrieve top-selling products by revenue
      operationId: getTopProductsReport
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
            default: TENANT_LK_01
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Top products retrieved successfully

  /api/v1/reports/dashboard:
    get:
      summary: Retrieve unified dashboard metrics for back-office portal
      operationId: getDashboardSummary
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
            default: TENANT_LK_01
      responses:
        '200':
          description: Dashboard metrics retrieved successfully

  /api/v1/suppliers:
    post:
      summary: Register a new supplier
      operationId: createSupplier
      responses:
        '201':
          description: Supplier created
    get:
      summary: List suppliers with balance
      operationId: listSuppliers
      responses:
        '200':
          description: Supplier list

  /api/v1/suppliers/settlement:
    post:
      summary: Record payment to supplier
      operationId: recordSupplierSettlement
      responses:
        '201':
          description: Settlement recorded

  /api/v1/purchases/orders:
    post:
      summary: Create purchase order
      operationId: createPurchaseOrder
      responses:
        '201':
          description: Purchase order created
    get:
      summary: List purchase orders
      operationId: listPurchaseOrders
      responses:
        '200':
          description: Purchase order list

  /api/v1/purchases/grn:
    post:
      summary: Receive goods via GRN and update stock/cost basis
      operationId: createGRN
      responses:
        '201':
          description: GRN recorded and inventory updated
    get:
      summary: List Goods Received Notes
      operationId: listGRNs
      responses:
        '200':
          description: GRN list

